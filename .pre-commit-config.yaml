repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-files
        name: Scan working tree for secrets
        entry: gitleaks dir --redact --no-banner --verbose .
        stages: [manual]
      - id: gitleaks
        alias: gitleaks-history
        name: Scan commit history for secrets
        entry: gitleaks git --redact --no-banner --verbose .
        stages: [manual]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        name: Lint workflows and embedded shell
        files: ^\.github/workflows/.*\.ya?ml$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 9257c6050c0261b8c57e712f632dc4a8010109a9 # frozen: v1.25.2
    hooks:
      - id: zizmor
        name: Audit workflow security
        args: [--offline, --persona, pedantic, --no-progress]
        files: ^\.github/workflows/.*\.ya?ml$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-renovate
  - repo: local
    hooks:
      - id: tls-tests
        name: Test TLS monitoring and recovery
        entry: node --test .github/scripts/*.test.cjs
        language: system
        files: ^(\.github/(scripts/|workflows/(monitor-tls-cert|recover-tls-cert|checks)\.yml$)|\.pre-commit-config\.yaml$)
        pass_filenames: false
