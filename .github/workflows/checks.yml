name: CI Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Lint, security, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up latest Python 3
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up latest Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit and verify tool prerequisites
        run: |
          python -m pip install -r .github/ci-requirements.txt
          go version
          shellcheck --version

      - name: Run shared pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP: gitleaks # CI has no staged files; the next step scans commit history.
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            pre-commit run --all-files --show-diff-on-failure
          else
            config_changes=$(git diff --name-only "${BASE_SHA:?Missing PR base SHA}...${HEAD_SHA:?Missing PR head SHA}" -- \
              .pre-commit-config.yaml .github/ci-requirements.txt .github/workflows/checks.yml)
            if [ -n "$config_changes" ]; then
              echo "Hook or gate configuration changed; running all hooks."
              pre-commit run --all-files --show-diff-on-failure
            else
              pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
            fi
          fi

      - name: Scan full commit history for secrets
        if: ${{ !cancelled() }}
        run: pre-commit run gitleaks-history --hook-stage manual --all-files

  build:
    name: Build site
    uses: ./.github/workflows/build-site.yml # zizmor: ignore[self-repository] actionlint cannot parse $/ yet
    permissions:
      contents: read
      pages: read # Read the existing site configuration during the build.

  gate:
    name: Pre-merge Quality Gate
    if: ${{ always() }}
    needs: [hooks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate job to succeed
        env:
          HOOKS_RESULT: ${{ needs.hooks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Lint, security, and tests: $HOOKS_RESULT"
          echo "Build site: $BUILD_RESULT"
          if [ "$HOOKS_RESULT" != success ] || [ "$BUILD_RESULT" != success ]; then
            echo "::error::Every gate job must succeed before merging."
            exit 1
          fi
