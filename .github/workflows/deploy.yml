name: Deploy Site

on:
  push:
    branches: ["main"]
    paths:
      - 'web/**'
      - 'resume/**'
      - '.github/workflows/build-site.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    uses: ./.github/workflows/build-site.yml # zizmor: ignore[self-repository] actionlint cannot parse $/ yet
    permissions:
      contents: read
      pages: read # Read the existing site configuration during the build.

  deploy:
    name: Deploy static site
    permissions:
      pages: write # Publish the Pages artifact.
      id-token: write # Authenticate the Pages deployment using OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  cloudflare:
    name: Refresh CDN
    environment: github-pages
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
    steps:
      - name: Purge Cloudflare Cache
        env:
          CF_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "$body" | jq .
          if [ "$http_code" -ne 200 ]; then
            echo "::error::Cloudflare cache purge failed with HTTP $http_code"
            exit 1
          fi

      - name: Verify DNS records
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          CF_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          domain="${SITE_DOMAIN:?Set the SITE_DOMAIN repository variable}"
          expected="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io"

          echo "Checking Cloudflare DNS for $domain..."
          records=$(curl -sS --get \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
            --data-urlencode "name=$domain" \
            --data-urlencode "type=CNAME" \
            -H "Authorization: Bearer $CF_API_TOKEN")

          content=$(echo "$records" | jq -r '.result[0].content // empty')

          if [ "$content" = "$expected" ]; then
            echo "✓ DNS CNAME is correct: $domain → $content"
          else
            echo "::warning::DNS CNAME for $domain does not point to $expected (got: ${content:-<not found>}). Verify Cloudflare DNS settings."
          fi
