name: Monitor TLS Certificates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: tls-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Check Pages and Cloudflare TLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # Inspect the managed certificate without changing Pages settings.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check certificate and HTTPS endpoints
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        with:
          retries: 2
          script: |
            const check = require('./.github/scripts/check-tls.cjs');
            await check({ github, context, core, domain: process.env.SITE_DOMAIN });
